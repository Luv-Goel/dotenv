[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotenv-toolkit"
version = "0.1.0"
description = ".env file toolkit — load, validate, merge, diff, template"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
dotenv = "dotenv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dotenv*"]
